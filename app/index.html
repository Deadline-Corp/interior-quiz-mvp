<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEADLINE — конструктор квартиры</title>
<meta name="description" content="Спроектируй квартиру и обставь её товарами реальных магазинов Пхукета — план, вид на стену, заказ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3; --surface:#fefdfb; --ink:#1c1917; --ink-2:#57534e; --ink-3:#78716c;
    --line:#e7e5e4; --line-2:#d6d3d1;
    --accent:#0f766e; --accent-ink:#f4f7f6; --accent-soft:#e6f2f0;
    --warn:#92400e; --warn-bg:#fef3e2; --danger:#b91c1c; --danger-bg:#fdeaea;
    --ok:#15803d; --ok-bg:#e8f5ec;
    --r-sm:8px; --r-md:12px; --r-lg:16px;
    --shadow:0 10px 30px -12px rgba(28,25,23,.12);
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font:inherit;color:inherit}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}

  .app{display:grid;grid-template-rows:56px 1fr;height:100dvh}
  header{display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .brand b{font-weight:700;letter-spacing:.14em;font-size:14px}
  .brand span{color:var(--ink-3);font-size:12.5px}
  .steps{display:flex;gap:4px;margin:0 auto}
  .step-btn{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:13.5px;transition:background .18s,color .18s;white-space:nowrap}
  .step-btn:hover:not(:disabled){background:var(--bg)}
  .step-btn[aria-current="step"]{background:var(--ink);color:#f7f5f1}
  .step-btn .n{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:600}
  .step-btn:disabled{opacity:.4;cursor:not-allowed}
  .hdr-right{display:flex;align-items:center;gap:14px;white-space:nowrap}
  .hdr-stat{text-align:right;line-height:1.15}
  .hdr-stat small{display:block;color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
  .hdr-stat .num{font-size:14px;font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r-sm);font-weight:600;font-size:13px;transition:transform .12s,background .18s,box-shadow .18s;min-height:38px;text-decoration:none;justify-content:center}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover:not(:disabled){background:#0d6b63}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed}
  .btn-ghost{border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
  .btn-ghost:hover{background:var(--bg)}
  .btn-danger{color:var(--danger);border:1px solid #f3caca;background:var(--surface)}
  .btn-danger:hover{background:var(--danger-bg)}

  .screen{min-height:0;height:100%}
  .three{display:grid;grid-template-columns:308px 1fr 304px;min-height:0;height:100%}
  .panel{background:var(--surface);overflow-y:auto;min-height:0}
  .panel-l{border-right:1px solid var(--line)}
  .panel-r{border-left:1px solid var(--line)}
  .panel h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600;padding:16px 16px 8px}
  .canvas-wrap{position:relative;min-width:0;display:flex;flex-direction:column}
  svg.canvas{flex:1;touch-action:none;display:block}
  .canvas-foot{display:flex;gap:14px;align-items:center;padding:8px 16px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);background:var(--surface)}
  .canvas-foot kbd{font-family:var(--mono);font-size:10.5px;background:var(--bg);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}
  .hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#f7f5f1;font-size:12.5px;padding:7px 14px;border-radius:999px;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .2s;z-index:5;white-space:nowrap;max-width:90%}
  .hint.show{opacity:.95}

  /* plan templates */
  .tpl{display:flex;gap:12px;width:calc(100% - 32px);margin:0 16px 10px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);text-align:left;transition:border-color .18s,box-shadow .18s;background:var(--surface)}
  .tpl:hover{border-color:var(--accent);box-shadow:var(--shadow)}
  .tpl svg{flex:none;border-radius:6px;background:var(--bg)}
  .tpl b{display:block;font-size:14px;font-weight:600}
  .tpl small{color:var(--ink-2);font-size:12.5px;display:block;margin-top:2px}
  .tpl .meta{margin-top:6px;font-size:11.5px;color:var(--ink-3)}

  .field{padding:0 16px;margin-bottom:12px}
  .field label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
  .field input{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);min-height:38px}
  .field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:12px}
  .row2 .field{padding:0;margin:0}
  .inspector{border-top:1px solid var(--line);padding-bottom:12px}
  .inspector .actions{display:flex;gap:8px;padding:4px 16px 0}
  .muted-note{padding:10px 16px;color:var(--ink-3);font-size:12.5px}
  .sticky-cta{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;margin-top:8px}
  .sticky-cta p{font-size:11.5px;color:var(--ink-3);margin-top:7px;line-height:1.4}

  /* room bar (rooms screen) */
  .roombar{display:flex;gap:4px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
  .room-tab{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:13px;transition:background .18s,color .18s;min-height:34px;white-space:nowrap;border:1px solid transparent}
  .room-tab:hover{background:var(--bg)}
  .room-tab.on{background:var(--ink);color:#f7f5f1}
  .room-tab .cnt{font-family:var(--mono);font-size:10.5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 6px}

  .prod{display:flex;gap:11px;width:calc(100% - 32px);margin:0 16px 8px;padding:10px;border:1px solid var(--line);border-radius:var(--r-md);text-align:left;transition:border-color .15s,box-shadow .15s;background:var(--surface)}
  .prod:hover{border-color:var(--accent);box-shadow:var(--shadow)}
  .prod .mini{flex:none;width:52px;height:46px;border-radius:8px;background:var(--bg);display:grid;place-items:center}
  .prod b{display:block;font-size:13px;font-weight:600;line-height:1.3}
  .prod .dims{font-size:11px;color:var(--ink-3)}
  .prod .price-row{display:flex;align-items:baseline;gap:6px;margin-top:2px}
  .prod .price{font-weight:600;font-size:12.5px}
  .prod .old{color:var(--ink-3);text-decoration:line-through;font-size:11px}
  .badge{display:inline-block;font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:999px}
  .badge.promo{background:var(--warn-bg);color:var(--warn)}
  .store-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-2);margin-top:3px}
  .store-dot{width:7px;height:7px;border-radius:50%;flex:none}

  .swatches{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
  .sw{width:34px;height:34px;border-radius:8px;border:2px solid var(--line-2);cursor:pointer;transition:transform .12s,border-color .15s}
  .sw:hover{transform:scale(1.06)}
  .sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
  .sw-name{padding:0 16px 10px;font-size:12px;color:var(--ink-2)}
  .sel-card{border-top:1px solid var(--line);padding-bottom:8px}
  .sel-card .head{padding:12px 16px 2px}
  .sel-card .head b{font-size:13.5px}
  .sel-card .head .dims{font-size:11.5px;color:var(--ink-3)}
  .sel-actions{display:flex;gap:8px;padding:8px 16px 12px}

  .fresh{display:flex;align-items:center;gap:7px;margin:0 16px 12px;padding:8px 11px;background:var(--ok-bg);color:var(--ok);border-radius:var(--r-sm);font-size:12px;font-weight:500}
  .fresh .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .est-line{display:flex;justify-content:space-between;gap:10px;padding:7px 16px;font-size:12.5px;border-bottom:1px solid var(--line)}
  .est-line span:first-child{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .total-card{margin:12px 16px;padding:14px;border-radius:var(--r-md);background:var(--ink);color:#f7f5f1}
  .total-card small{display:block;font-size:11px;color:#d6d3d1;text-transform:uppercase;letter-spacing:.08em}
  .total-card .num{font-size:20px;font-weight:600}
  .warns{margin:0 16px 10px;display:flex;flex-direction:column;gap:6px}
  .warn-chip{display:flex;gap:8px;background:var(--danger-bg);color:var(--danger);font-size:12px;padding:8px 10px;border-radius:var(--r-sm);font-weight:500}
  .empty{margin:0 16px 12px;padding:18px 14px;border:1.5px dashed var(--line-2);border-radius:var(--r-md);color:var(--ink-3);font-size:12.5px;text-align:center}
  .actions-stack{padding:4px 16px 18px;display:flex;flex-direction:column;gap:8px}
  .plan-badge{display:inline-flex;align-items:center;gap:7px;margin:14px 16px 8px;padding:8px 11px;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-sm);font-size:12px;font-weight:500}

  /* order screen */
  .order-wrap{overflow-y:auto;padding:28px 24px 48px;height:100%}
  .order-h{max-width:1060px;margin:0 auto 18px}
  .order-h h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
  .order-h p{color:var(--ink-2);margin-top:4px;font-size:14px}
  .order-grid{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:1.6fr 1fr;gap:22px;align-items:start}
  .order-col{display:flex;flex-direction:column;gap:14px}
  .ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
  .ocard>header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
  .ocard>header b{font-size:14px}
  .ocard>header .badge-n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}
  .ocard .body{padding:6px 0 8px}
  .pay-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
  .pay-row .num{font-size:16px;font-weight:600}
  .paid{color:var(--ok);font-weight:600;display:inline-flex;gap:7px;align-items:center;font-size:13.5px}
  .note{font-size:12.5px;color:var(--ink-2);background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;line-height:1.55}
  .ocard .field{padding:0 16px;margin-bottom:10px}

  /* plan svg */
  .room{fill:#fdfcfa;stroke:var(--ink);stroke-width:2}
  .room.sel{stroke:var(--accent);stroke-width:2.5}
  .room-label{font-size:11px;fill:var(--ink-2);font-family:'Outfit',sans-serif;pointer-events:none}
  .room-dim{font-size:10px;fill:var(--ink-3);font-family:var(--mono);pointer-events:none}
  .item.sel-out{filter:drop-shadow(0 3px 6px rgba(15,118,110,.45))}

  @media (max-width:1000px){
    .three{grid-template-columns:1fr;grid-template-rows:auto 46vh auto}
    .panel{max-height:34vh}
    .order-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>DEADLINE</b><span id="brandSub">конструктор квартиры</span></div>
    <nav class="steps" aria-label="Этапы">
      <button class="step-btn" id="stepPlan"><span class="n">1</span>Планировка</button>
      <button class="step-btn" id="stepRooms"><span class="n">2</span>Помещения</button>
      <button class="step-btn" id="stepOrder"><span class="n">3</span>Заказ</button>
    </nav>
    <div class="hdr-right">
      <div class="hdr-stat"><small id="statLabel">Площадь</small><span class="num" id="statVal">0 м²</span></div>
      <div class="hdr-stat"><small>Проект</small><span class="num" id="statTotal">฿ 0</span></div>
    </div>
  </header>

  <!-- ===== Экран 1: Планировка ===== -->
  <section class="screen" id="screenPlan">
    <div class="three" style="grid-template-columns:330px 1fr">
      <aside class="panel panel-l" id="planLeft"></aside>
      <section class="canvas-wrap">
        <div class="hint" id="planHint"></div>
        <svg class="canvas" id="planSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="canvas-foot">
          <span><kbd>Del</kbd> удалить</span><span><kbd>Esc</kbd> отмена</span>
          <span style="margin-left:auto">Сетка 1 м · комнаты тащатся мышью · демо</span>
        </div>
      </section>
    </div>
  </section>

  <!-- ===== Экран 2: Помещения (вид на стену) ===== -->
  <section class="screen" id="screenRooms" hidden>
    <div style="display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0">
      <div class="roombar" id="roomBar" role="tablist" aria-label="Помещения"></div>
      <div class="three">
        <aside class="panel panel-l" id="roomsLeft"></aside>
        <section class="canvas-wrap">
          <div class="hint" id="wallHint"></div>
          <svg class="canvas" id="wallSvg" xmlns="http://www.w3.org/2000/svg"></svg>
          <div class="canvas-foot">
            <span><kbd>Del</kbd> убрать</span><span><kbd>Esc</kbd> снять выбор</span>
            <span style="margin-left:auto" id="wallInfo"></span>
          </div>
        </section>
        <aside class="panel panel-r" id="roomsRight"></aside>
      </div>
    </div>
  </section>

  <!-- ===== Экран 3: Заказ ===== -->
  <section class="screen" id="screenOrder" hidden>
    <div class="order-wrap" id="orderWrap"></div>
  </section>
</div>

<script>
'use strict';
/* =====================================================================
   DEADLINE — единое приложение (POC). Одна страница, три экрана:
   План квартиры → Помещения (вид на стену) → Заказ.
   Vanilla JS + SVG, без сборки. Состояние в localStorage 'dl-app'.
   ===================================================================== */
const $  = s => document.querySelector(s);
const fmtTHB = n => '฿ ' + n.toLocaleString('th-TH');
const fmtM = n => (Math.round(n*100)/100).toLocaleString('ru-RU');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- справочники ---------- */
const STORES = {
  homepro:{name:'HomePro',color:'#1d4ed8'}, index:{name:'Index Living Mall',color:'#b45309'},
  ikea:{name:'IKEA Thailand',color:'#0f766e'}, powerbuy:{name:'Power Buy',color:'#7c2d12'},
};
const FACADES = [{name:'Белый',fill:'#e9e4da'},{name:'Красный',fill:'#a8423c'},{name:'Зелёный',fill:'#5f7a5c'},{name:'Графит',fill:'#45433f'},{name:'Дуб',fill:'#b08a55',grain:true}];
const FABRICS = [{name:'Бежевый',fill:'#cbbfa8'},{name:'Серый',fill:'#8e8a84'},{name:'Терракота',fill:'#b06a4d'},{name:'Синий',fill:'#5a6e85'},{name:'Зелёный',fill:'#6d7f6a'}];
const APPLIANCE = [{name:'Сталь',fill:'#b9bcbd'},{name:'Зелёный',fill:'#5f7a5c'},{name:'Чёрный',fill:'#35332f'},{name:'Бежевый',fill:'#d9cfc0'}];
const WOODS = [{name:'Дуб',fill:'#b08a55',grain:true},{name:'Белый',fill:'#e9e4da'},{name:'Венге',fill:'#5a4636',grain:true}];

/* каталог: w,h — фронтальные см; mount: floor|wall|ceil|bg; rooms — типы помещений */
const CATALOG = [
  {sku:'KB60',name:'Кухонный модуль 60',store:'homepro',price:4290,w:60,h:85,mount:'floor',draw:'base',vars:FACADES,rooms:['kitchen']},
  {sku:'KB80',name:'Кухонный модуль 80',store:'homepro',price:5490,w:80,h:85,mount:'floor',draw:'base',vars:FACADES,rooms:['kitchen']},
  {sku:'KS80',name:'Модуль с мойкой 80',store:'homepro',price:7190,old:8490,w:80,h:85,mount:'floor',draw:'sink',vars:FACADES,rooms:['kitchen']},
  {sku:'KT60',name:'Пенал кухонный 60',store:'ikea',price:8990,w:60,h:200,mount:'floor',draw:'tall',vars:FACADES,rooms:['kitchen']},
  {sku:'KW60',name:'Навесной шкаф 60',store:'homepro',price:2790,w:60,h:72,mount:'wall',elev:145,draw:'wallcab',vars:FACADES,rooms:['kitchen']},
  {sku:'KW80',name:'Навесной шкаф 80',store:'homepro',price:3290,w:80,h:72,mount:'wall',elev:145,draw:'wallcab',vars:FACADES,rooms:['kitchen']},
  {sku:'HOOD',name:'Вытяжка 60',store:'powerbuy',price:4990,w:60,h:40,mount:'wall',elev:165,draw:'hood',vars:APPLIANCE.slice(0,3),rooms:['kitchen']},
  {sku:'FR70',name:'Холодильник 70',store:'powerbuy',price:21990,old:25990,w:70,h:180,mount:'floor',draw:'fridge',vars:APPLIANCE,rooms:['kitchen']},
  {sku:'OV60',name:'Плита + духовка 60',store:'powerbuy',price:17990,w:60,h:85,mount:'floor',draw:'oven',vars:[APPLIANCE[0],APPLIANCE[2]],rooms:['kitchen']},
  {sku:'WM60',name:'Стиральная машина',store:'powerbuy',price:14990,w:60,h:85,mount:'floor',draw:'washer',vars:[{name:'Белый',fill:'#e9e6df'},APPLIANCE[0]],rooms:['kitchen','bath','balcony']},
  {sku:'SF180',name:'Диван 2-местный',store:'index',price:18900,w:180,h:85,mount:'floor',draw:'sofa',vars:FABRICS,rooms:['living']},
  {sku:'SF230',name:'Диван 3-местный',store:'index',price:28900,old:34900,w:230,h:90,mount:'floor',draw:'sofa',vars:FABRICS,rooms:['living']},
  {sku:'AR85',name:'Кресло',store:'index',price:8590,w:85,h:80,mount:'floor',draw:'sofa',vars:FABRICS,rooms:['living','bedroom','balcony']},
  {sku:'TV55',name:'Телевизор 55"',store:'powerbuy',price:12990,w:123,h:71,mount:'wall',elev:110,draw:'tv',vars:[{name:'Чёрный',fill:'#2c2a27'}],rooms:['living','bedroom']},
  {sku:'SH80',name:'Полка настенная 80',store:'ikea',price:1290,w:80,h:22,mount:'wall',elev:150,draw:'shelf',vars:WOODS,rooms:['living','bedroom','kitchen','balcony']},
  {sku:'FL40',name:'Торшер',store:'index',price:2490,w:42,h:150,mount:'floor',draw:'flamp',vars:FABRICS.slice(0,3),rooms:['living','bedroom','balcony']},
  {sku:'PD45',name:'Подвесной светильник',store:'homepro',price:3290,w:45,h:60,mount:'ceil',draw:'pendant',vars:[{name:'Латунь',fill:'#bf9b5e'},{name:'Чёрный',fill:'#35332f'},{name:'Белый',fill:'#e9e4da'}],rooms:['kitchen','living','bedroom']},
  {sku:'CUR2',name:'Шторы 200',store:'index',price:3290,w:200,h:255,mount:'bg',draw:'curtain',vars:FABRICS,rooms:['living','bedroom']},
  {sku:'WIN14',name:'Окно 140 (элемент)',store:null,price:0,w:140,h:140,mount:'bg',elev:90,draw:'window',vars:[{name:'Рама белая',fill:'#e9e4da'},{name:'Рама графит',fill:'#45433f'}],rooms:['kitchen','living','bedroom','bath','balcony']},

function roomTypes(name){
  const n=String(name).toLowerCase(), t=new Set();
  if(/кух/.test(n))t.add('kitchen');
  if(/гостин|зал|комнат/.test(n))t.add('living');
  if(/студ/.test(n)){t.add('living');t.add('kitchen');t.add('bedroom');}
  if(/спал/.test(n))t.add('bedroom');
  if(/с\/у|сан|ванн|туал/.test(n))t.add('bath');
  if(/балк|лодж/.test(n))t.add('balcony');
  if(!t.size)t.add('living');
  return [...t];
}

function drawPlan(){

function planPoint(ev){const pt=new DOMPoint(ev.clientX,ev.clientY),m=planSvg.getScreenCTM();if(!m)return{x:0,y:0};const p=pt.matrixTransform(m.inverse());return{x:p.x/SCALE,y:p.y/SCALE};}
planSvg.addEventListener('pointerdown',ev=>{

  roomKey = String(app.rooms[0].id);

function itemBox(it){const p=prod(it.sku);return{x:it.x,y:it.y,w:p.w/100,h:p.h/100};}
function problems(it,w){
  const p=prod(it.sku),b=itemBox(it),out=[];
  if(b.x<-0.001||b.x+b.w>w.wallW+0.001)out.push(`${p.name}: выходит за край стены (${p.w} см)`);
  if(layer(p)!=='bg')for(const o of w.items){if(o.id===it.id)continue;const po=prod(o.sku);if(layer(po)!==layer(p))continue;const ob=itemBox(o);if(b.x<ob.x+ob.w&&b.x+b.w>ob.x&&b.y<ob.y+ob.h&&b.y+b.h>ob.y){out.push(`${p.name}: пересекается с «${po.name}»`);break;}}
  return out;
}
function allEntries(){const out=[];for(const r of app.rooms){const w=app.walls[r.id];if(!w)continue;for(const it of w.items){const p=prod(it.sku);if(p.store)out.push({room:r.name,it,p});}}return out;}
function allProblems(){const out=[];for(const r of app.rooms){const w=app.walls[r.id];if(!w||!w.items.length)continue;for(const it of w.items)for(const t of problems(it,w))out.push(`${r.name}: ${t}`);}return out;}

let WPX=180; const FLOOR_H=0.45;
function wallScale(){const r=wallSvg.getBoundingClientRect(),w=curWall();WPX=Math.min((r.width-80)/w.wallW,(r.height-60)/(w.wallH+FLOOR_H));WPX=Math.max(60,Math.min(260,WPX));}
const wmx=m=>40+m*WPX, wmy=m=>20+(curWall().wallH-m)*WPX;
function drawWall(){
  wallScale();const w=curWall(),W=w.wallW,H=w.wallH;
  wallSvg.setAttribute('viewBox',`0 0 ${W*WPX+80} ${(H+FLOOR_H)*WPX+40}`);
  let g=grainDefs();
  g+=`<rect x="${wmx(0)}" y="${wmy(H)}" width="${W*WPX}" height="${H*WPX}" fill="${w.paint}"/>`;
  g+=`<rect x="${wmx(0)}" y="${wmy(0)}" width="${W*WPX}" height="${FLOOR_H*WPX}" fill="${FLOOR}"/>`;
  for(let i=1;i<6;i++)g+=`<line x1="${wmx(0)}" y1="${wmy(0)+FLOOR_H*WPX/6*i}" x2="${wmx(W)}" y2="${wmy(0)+FLOOR_H*WPX/6*i}" stroke="rgba(28,25,23,.08)"/>`;
  g+=`<rect x="${wmx(0)}" y="${wmy(0)-6}" width="${W*WPX}" height="6" fill="#dcd5c8"/>`;
  g+=`<rect x="${wmx(0)}" y="${wmy(H)}" width="${W*WPX}" height="${H*WPX}" fill="none" stroke="#a39e94" stroke-width="2"/>`;
  g+=`<line x1="${wmx(0)}" y1="${wmy(H)-12}" x2="${wmx(W)}" y2="${wmy(H)-12}" stroke="#a8a29e"/><text x="${wmx(W/2)}" y="${wmy(H)-18}" text-anchor="middle" font-size="11" fill="#78716c" font-family="JetBrains Mono">${W.toFixed(1).replace('.',',')} м</text>`;
  const order={bg:0,floor:1,wall:2,ceil:3};
  const sorted=[...w.items].sort((a,b)=>order[layer(prod(a.sku))]-order[layer(prod(b.sku))]);
  for(const it of sorted){
    const p=prod(it.sku),pw=p.w/100*WPX,ph=p.h/100*WPX,x=wmx(it.x),y=wmy(it.y+p.h/100);
    const bad=problems(it,w).length>0,s=wallSel===it.id;
    if(layer(p)==='floor')g+=`<ellipse cx="${x+pw/2}" cy="${wmy(0)+3}" rx="${pw/2*0.92}" ry="4.5" fill="rgba(28,25,23,.10)"/>`;
    const body = p.img ? `<image href="assets/products/${p.img}" x="0" y="0" width="${pw}" height="${ph}" preserveAspectRatio="none"/>` : DRAW[p.draw](pw,ph,p.vars[it.variant]);
    g+=`<g data-item="${it.id}" transform="translate(${x} ${y})" style="cursor:grab">${body}
      ${bad?`<rect x="-3" y="-3" width="${pw+6}" height="${ph+6}" fill="rgba(185,28,28,.12)" stroke="#b91c1c" stroke-width="2" rx="4"/>`:''}
      ${s?`<rect x="-4" y="-4" width="${pw+8}" height="${ph+8}" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" rx="4"/><text x="${pw/2}" y="-10" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="600" font-family="JetBrains Mono">${p.w}×${p.h}</text>`:''}
    </g>`;
  }
  if(!w.items.length)g+=`<text x="${wmx(W/2)}" y="${wmy(H/2)}" text-anchor="middle" font-size="14" fill="#a39e94" font-family="Outfit">Пустая стена — выбери товар слева</text>`;
  wallSvg.innerHTML=g;
  $('#wallInfo').textContent=`${meta_name()} · стена ${W.toFixed(1).replace('.',',')} × ${H.toFixed(2).replace('.',',')} м · схематичный режим`;
}
function meta_name(){return roomMeta(roomKey).name;}
function defaultY(p){const w=curWall();if(p.mount==='floor')return 0;if(p.mount==='ceil')return w.wallH-p.h/100;return (p.elev??120)/100;}
function addItem(sku){
  const p=prod(sku),w=curWall(),pw=p.w/100,lay=layer(p);
  if(pw>w.wallW){wallHintShow(`«${p.name}» шире стены (${p.w} см) — расширь стену`);return;}
  // ставим впритык справа от последнего предмета того же слоя (мебель в ряд вдоль стены)
  let x=0;
  const same=w.items.filter(o=>layer(prod(o.sku))===lay);
  if(same.length) x=Math.max(...same.map(o=>o.x+prod(o.sku).w/100));
  if(x+pw>w.wallW+0.001) x=Math.max(0,(w.wallW-pw)/2);  // в ряд не влезает — в центр (конфликт подсветится честно)
  const it={id:app.nextItemId++,sku,x:Math.round(x*100)/100,y:defaultY(p),variant:0};
  let guard=0;while(problems(it,w).length&&guard<40){it.x=Math.min(w.wallW-pw,it.x+0.2);guard++;if(it.x>=w.wallW-pw)break;}
  w.items.push(it);wallSel=it.id;renderRooms();
}
function wallPoint(ev){const pt=new DOMPoint(ev.clientX,ev.clientY),m=wallSvg.getScreenCTM();if(!m)return{x:0,y:0};const p=pt.matrixTransform(m.inverse());return{x:(p.x-40)/WPX,y:curWall().wallH-(p.y-20)/WPX};}
const snap1=v=>Math.round(v*100)/100;
function snapEdges(it,nx){const w=curWall(),p=prod(it.sku),pw=p.w/100,T=0.04;let best=nx;const edges=[0,w.wallW-pw];for(const o of w.items){if(o.id===it.id)continue;const po=prod(o.sku);if(layer(po)!==layer(p))continue;const ob=itemBox(o);edges.push(ob.x+ob.w,ob.x-pw);}for(const e of edges)if(Math.abs(nx-e)<T)best=e;return best;}
wallSvg.addEventListener('pointerdown',ev=>{
  const el=ev.target.closest('[data-item]');
  if(el){const it=curWall().items.find(i=>i.id==el.dataset.item);const pos=wallPoint(ev);wallSel=it.id;wallDrag={id:it.id,dx:pos.x-it.x,dy:pos.y-it.y};try{wallSvg.setPointerCapture(ev.pointerId);}catch(e){}renderRooms();return;}
  wallSel=null;renderRooms();
});
wallSvg.addEventListener('pointermove',ev=>{
  if(!wallDrag)return;const w=curWall(),it=w.items.find(i=>i.id===wallDrag.id);if(!it)return;const p=prod(it.sku),pos=wallPoint(ev);
  let nx=snap1(pos.x-wallDrag.dx);nx=Math.max(-0.2,Math.min(w.wallW-p.w/100+0.2,nx));it.x=snapEdges(it,nx);
  if(p.mount==='wall'||p.mount==='bg'){let ny=snap1(pos.y-wallDrag.dy);it.y=Math.max(0,Math.min(w.wallH-p.h/100,ny));}
  drawWall();
});
wallSvg.addEventListener('pointerup',()=>{if(wallDrag){wallDrag=null;renderRooms();}});
function renderRooms(){ if(!roomKey||!curWall())return; renderRoomBar(); drawWall(); renderRoomsLeft(); renderRoomsRight(); syncHeader(); save(); }

const _imgCache={};
function imgToDataURI(path){
  return fetch(path).then(r=>r.blob()).then(b=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);}));
}
async function exportPNG(){
  const w=curWall();
  const paths=[...new Set(w.items.map(i=>prod(i.sku).img).filter(Boolean))];
  try{ for(const p of paths){ if(!_imgCache[p]) _imgCache[p]=await imgToDataURI('assets/products/'+p); } }
  catch(e){ wallHintShow('Не удалось подгрузить фото для PNG'); return; }
  const keep=wallSel;wallSel=null;drawWall();
  let data=new XMLSerializer().serializeToString(wallSvg);
  for(const p of paths){ data=data.split('assets/products/'+p).join(_imgCache[p]); }  // встроить фото как base64
  const url=URL.createObjectURL(new Blob([data],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{const vb=wallSvg.viewBox.baseVal,k=2,c=document.createElement('canvas');c.width=vb.width*k;c.height=vb.height*k;const ctx=c.getContext('2d');ctx.fillStyle='#f7f6f3';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const a=document.createElement('a');a.download=`deadline-${roomMeta(roomKey).types[0]}.png`;a.href=c.toDataURL('image/png');a.click();wallHintShow('Картинка стены скачана');wallSel=keep;renderRooms();};
  img.onerror=()=>{URL.revokeObjectURL(url);wallHintShow('Не удалось собрать PNG — открой в Chrome/Edge');wallSel=keep;renderRooms();};
  img.src=url;
}

    <div class="order-grid">
      <div class="order-col">
        ${orders.map(([st,arr],i)=>`<div class="ocard">
          <header><span class="store-dot" style="background:${STORES[st].color}"></span><b>${STORES[st].name}</b><span class="badge-n">чек ${i+1} из ${orders.length}</span></header>
          <div class="body">${arr.map(e=>`<div class="est-line" style="border:none;padding:6px 16px"><span>${esc(e.p.name)} · ${esc(e.p.vars[e.it.variant].name)} · ${esc(e.room)}</span><span class="num">${fmtTHB(e.p.price)}</span></div>`).join('')}</div>
          <div class="pay-row"><span class="num">${fmtTHB(arr.reduce((s,e)=>s+e.p.price,0))}</span>
            ${app.paid[st]?`<span class="paid">Оплачено · передан магазину</span>`:`<button class="btn btn-primary" data-pay="${st}">Оплатить (PromptPay QR)</button>`}</div>
        </div>`).join('')||'<div class="empty">Заказ пуст</div>'}
      </div>
      <div class="order-col">
        <div class="ocard"><header><b>Доставка</b></header><div class="body" style="padding:14px 0 4px">
          <div class="field"><label>Имя</label><input id="dName" placeholder="Как к вам обращаться"></div>
          <div class="field"><label>Телефон / WhatsApp</label><input id="dPhone" type="tel" inputmode="tel" placeholder="+66 ..."></div>
          <div class="field"><label>ЖК / адрес и номер юнита</label><input id="dAddr" placeholder="Например: Laguna Skypark, юнит A-204"></div>
          <div class="field"><label>Желаемая дата доставки</label><input id="dDate" type="date"></div>
        </div><div class="pay-row"><span class="num" style="font-size:13px;color:var(--ink-2)">Итого: <b>${fmtTHB(projTotal())}</b></span><button class="btn btn-ghost" id="sendDelivery">Отправить данные</button></div></div>
        <div class="note"><b>Дальше:</b> магазины собирают свои части заказа, статусы всех доставок — в одном кабинете. Демо без бэкенда: оплата и отправка — заглушки.</div>
        <button class="btn btn-ghost" id="backRooms">← Вернуться к помещениям</button>
      </div>
    </div>`;
  wrap.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{app.paid[b.dataset.pay]=true;renderOrder();save();});
  $('#backRooms').onclick=()=>show('rooms');
  $('#sendDelivery').onclick=()=>wallHintShow('Данные доставки отправлены (демо). В Фазе 1 — уведомление магазинам и менеджеру');
}

/* ====================================================================
   НАВИГАЦИЯ И ШАПКА
   ==================================================================== */
function syncHeader(){
  const hasPlan=app.rooms.length>0, hasItems=allEntries().length>0;
  $('#stepPlan').setAttribute('aria-current', app.screen==='plan'?'step':'false');
  $('#stepRooms').setAttribute('aria-current', app.screen==='rooms'?'step':'false');
  $('#stepOrder').setAttribute('aria-current', app.screen==='order'?'step':'false');
  if(app.screen!=='plan')$('#stepPlan').removeAttribute('aria-current');
  $('#stepRooms').disabled=!hasPlan; $('#stepOrder').disabled=!hasItems;
  if(app.screen==='plan'){$('#statLabel').textContent='Площадь';$('#statVal').textContent=fmtM(totalArea())+' м²';}
  else{$('#statLabel').textContent=roomMeta(roomKey).name;$('#statVal').textContent=(curWall()?curWall().items.filter(i=>prod(i.sku).store).length:0)+' поз.';}
  $('#statTotal').textContent=fmtTHB(projTotal());
}
function show(screen){
  app.screen=screen;
  $('#screenPlan').hidden=screen!=='plan';
  $('#screenRooms').hidden=screen!=='rooms';
  $('#screenOrder').hidden=screen!=='order';
  if(screen==='plan')renderPlan();
  else if(screen==='rooms'){ if(!roomKey||!curWall()){ if(app.rooms.length){confirmPlanSilent();} } renderRooms(); }
  else if(screen==='order')renderOrder();
  syncHeader(); save();
}
function confirmPlanSilent(){
  for(const r of app.rooms){ if(!app.walls[r.id]){const types=roomTypes(r.name);app.walls[r.id]={wallW:Math.round(Math.max(r.w,r.h)*10)/10,wallH:2.7,paint:TYPE_PAINT[types[0]],items:[]};} }
  if(!roomKey||!app.rooms.find(r=>String(r.id)===String(roomKey))) roomKey=String(app.rooms[0].id);
}
$('#stepPlan').onclick=()=>show('plan');
$('#stepRooms').onclick=()=>{if(app.rooms.length)show('rooms');};
$('#stepOrder').onclick=()=>{if(allEntries().length)show('order');};

document.addEventListener('keydown',ev=>{
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(app.screen==='plan'){
    if(ev.key==='Escape'){planSel=null;renderPlan();}
    if(ev.key==='Delete'&&planSel!=null){app.rooms=app.rooms.filter(r=>r.id!==planSel);planSel=null;renderPlan();}
  }else if(app.screen==='rooms'){
    if(ev.key==='Escape'){wallSel=null;renderRooms();}
    if((ev.key==='Delete'||ev.key==='Backspace')&&wallSel!=null){const w=curWall();w.items=w.items.filter(i=>i.id!==wallSel);wallSel=null;renderRooms();}
  }
});
window.addEventListener('resize',()=>{if(app.screen==='plan')drawPlan();else if(app.screen==='rooms')drawWall();});

/* ---------- старт ---------- */
if(app.screen==='rooms'&&app.rooms.length){confirmPlanSilent();}
if(app.screen==='order'&&!allEntries().length)app.screen='plan';
show(app.screen);
if(!app.rooms.length)planHintShow('Привет! Начни с шаблона планировки слева — или собери свой план',4200);
</script>
</body>
</html>
